name: JobSync production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jobsync-production-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'lucapetrh-dev/jobsync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: python3 -m unittest discover -s tests/deployment -v

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build production image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/lucapetrh-dev/jobsync:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/lucapetrh-dev/jobsync
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=jobsync-production
          cache-to: type=gha,mode=max,scope=jobsync-production
      - name: Confirm main is still this revision
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          CURRENT_SHA=$(gh api repos/lucapetrh-dev/jobsync/git/ref/heads/main --jq .object.sha)
          if [ "$CURRENT_SHA" = "$RELEASE_SHA" ]; then
            echo 'promote=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Promote validated digest
        if: steps.current.outputs.promote == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/lucapetrh-dev/jobsync:production \
            "ghcr.io/lucapetrh-dev/jobsync@$IMAGE_DIGEST"
