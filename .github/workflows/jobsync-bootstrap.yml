name: JobSync initial image
on:
  push:
    branches: [feature/jobsync-ovh-deployment]
permissions:
  contents: read
  packages: write
concurrency:
  group: jobsync-bootstrap
  cancel-in-progress: false
jobs:
  image:
    if: github.repository == 'lucapetrh-dev/jobsync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: python3 -m unittest discover -s tests/deployment -v
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/lucapetrh-dev/jobsync:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/lucapetrh-dev/jobsync
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=jobsync-production
          cache-to: type=gha,mode=max,scope=jobsync-production
